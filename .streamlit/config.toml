# Streamlit Configuration File
# This file configures various Streamlit settings including session behavior

[server]
# Server configuration
maxUploadSize = 200
enableXsrfProtection = true
# enableCORS must be true when enableXsrfProtection is true
# This is required for Streamlit's CSRF protection to work properly

# IMPORTANT: This is Streamlit's BUILT-IN security feature, NOT the cookie manager we removed!
# Used for CSRF protection and session cookie encryption (required by Streamlit)
# Change this to a secure random string in production
# Generate with: python -c "import secrets; print(secrets.token_hex(32))"
cookieSecret = "your_secret_cookie_key_change_in_production_abc123"

# Note: Session timeout is managed by Streamlit automatically
# Sessions persist as long as the browser tab is open and WebSocket connection is active
# This is ideal for our use case with session state authentication

[browser]
# Keep the connection alive longer
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8501

[client]
# Show loading animation when reconnecting
showErrorDetails = true
toolbarMode = "minimal"

[runner]
# Increase timeouts to prevent session drops
# These settings help maintain the session longer
magicEnabled = true
fastReruns = true

[logger]
# Logging level
level = "info"

# Session State Configuration
# Note: Streamlit handles session state automatically, but these settings help


