# EC2 + Postgres/Redis on host: use host networking so 127.0.0.1 matches services on the instance.
# Example: docker compose --env-file .env -f docker-compose.production.yml up -d --build

services:
  streampage:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${STREAMPAGE_IMAGE:-streampage:latest}
    container_name: streampage-app
    network_mode: host
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      APP_DB_USER: ${APP_DB_USER:-trading_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-password123}
      NSE_DATA_DB_NAME: ${NSE_DATA_DB_NAME:-nsedata}
      TRADING_DB_NAME: ${TRADING_DB_NAME:-trading_db}
      POSTGRES_CONNECT_TIMEOUT: ${POSTGRES_CONNECT_TIMEOUT:-10}
      POSTGRES_KEEPALIVES_IDLE: ${POSTGRES_KEEPALIVES_IDLE:-30}
      POSTGRES_KEEPALIVES_INTERVAL: ${POSTGRES_KEEPALIVES_INTERVAL:-10}
      POSTGRES_KEEPALIVES_COUNT: ${POSTGRES_KEEPALIVES_COUNT:-3}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./.streamlit/config.toml:/app/.streamlit/config.toml:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
